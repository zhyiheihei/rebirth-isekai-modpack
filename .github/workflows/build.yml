name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "构建完成后发布 Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full zstd curl

      - name: 取版本号并校验 tag
        id: ver
        run: |
          python3 -c "import json,os,sys; v=json.load(open('pack/pack.json',encoding='utf-8'))['version']; t=os.environ.get('GITHUB_REF_NAME',''); sys.exit(0 if (not t.startswith('v') or t.lstrip('v')==v) else f'tag {t} 与 pack.json 的 version {v} 不一致')"
          echo "version=v$(python3 -c "import json;print(json.load(open('pack/pack.json',encoding='utf-8'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: 缓存下载物
        uses: actions/cache@v4
        with:
          path: |
            cache/mods
            cache/launcher
            cache/runtimes
            cache/translations
            cache/resources
            local-assets
          key: deps-${{ hashFiles('pack/*.json') }}

      - name: 拉取依赖（mods / 启动器 / Java / 翻译 / 游戏资源 / 材质）
        run: python3 scripts/fetch.py

      - name: 组装三平台便携包 + PCL2 实例包
        run: python3 scripts/build.py --zip

      - name: 生成 Release 说明
        id: notes
        run: python3 scripts/release_notes.py --github

      - name: 产物自检（启动免下载）
        run: python3 scripts/verify_bundle.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: modpack-${{ github.ref_name }}
          path: |
            dist/*.7z
          if-no-files-found: error
          retention-days: 14

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          name: "重生：异世界冒险 ${{ steps.ver.outputs.version }}"
          tag_name: ${{ steps.ver.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: dist/*.7z
          fail_on_unmatched_files: true
