name: build

# 滚动更新：只有一个分支 master，不打 tag。
# 版本写在提交信息里，形如 `release: 0.2.4`（或 `[release 0.2.4]`），这一句决定是否构建。
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-master
  cancel-in-progress: false

env:
  RELEASE_TAG: rolling

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # 普通提交不构建；提交信息里出现 release 才构建。手动触发无条件构建。
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full zstd curl unzip

      - name: 从提交信息取版本
        id: ver
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          msg = os.environ.get("COMMIT_MSG", "") or os.environ.get("GITHUB_REF_NAME", "")
          m = re.search(r"release[:\s]+v?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)", msg)
          if m:
              version = m.group(1)
              print(f"source=提交信息")
          else:
              version = json.load(open("pack/pack.json", encoding="utf-8"))["version"]
              print(f"source=pack.json（提交信息里没写版本）", file=os.sys.stderr)
          print(f"version={version}")
          print(f"tag=v{version}")
          PY
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}

      - name: 把版本写进 pack.json
        run: |
          echo "构建版本：${{ steps.ver.outputs.version }}"
          python3 scripts/set_version.py "${{ steps.ver.outputs.version }}"

      - name: 缓存下载物
        uses: actions/cache@v4
        with:
          path: |
            cache/mods
            cache/launcher
            cache/runtimes
            cache/translations
            cache/resources
            local-assets
          key: deps-${{ hashFiles('pack/mods.json', 'pack/runtimes.json', 'pack/launcher.json', 'pack/local-assets.json') }}
          restore-keys: |
            deps-

      - name: 拉取依赖（mods / 启动器 / Java / 翻译 / 游戏资源 / 材质）
        run: python3 scripts/fetch.py

      - name: 组装三平台便携包 + PCL2 实例包
        run: python3 scripts/build.py --zip

      - name: 生成 Release 说明
        id: notes
        run: python3 scripts/release_notes.py --github

      - name: 产物自检（启动免下载，不阻断发布）
        # 测试版策略：自检只报告，不阻断。发现问题就把版本加一位发新版，不回退旧版本。
        continue-on-error: true
        run: python3 scripts/verify_bundle.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: modpack-${{ steps.ver.outputs.version }}
          path: |
            dist/*.7z
          if-no-files-found: error
          retention-days: 14

      - name: 清掉滚动 Release 上的旧资产
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null |
            while read -r name; do
              [ -n "$name" ] && gh release delete-asset "$RELEASE_TAG" "$name" -y
            done

      - name: 发布（滚动覆盖同一个 Release）
        uses: softprops/action-gh-release@v2
        with:
          name: "重生：异世界冒险 ${{ steps.ver.outputs.version }}（滚动测试版）"
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            **版本 ${{ steps.ver.outputs.version }}** — 由提交 `${{ github.sha }}` 自动构建。

            ${{ steps.notes.outputs.notes }}
          files: dist/*.7z
          prerelease: true
          fail_on_unmatched_files: true
          overwrite_files: true
