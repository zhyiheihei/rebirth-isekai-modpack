MaximumDepth=8 #Higher means more Junctions | default: 8
MaximumShips=1 #Best value is 10 to allow for many ships | default: 1
MaximumMiddleTowers=2 #Best Value is 3-6 | default: 2
BridgeLength=short #Choose between: short, medium, long. Best for large cities is medium | default: short
PrioritizeBranching=false #Setting this to true will make more branches occur. Can cause more overlap. Best is true | default: false
MoreLootRooms=false #Single-floor houses often get their second and third (loot) floors when they fit | default: false
MaximumPieces=1000 #Maximum number of pieces in one city | default: 1000
MaximumRadiusChunks=8 #How far (in chunks) a city can reach from its center, 4 to 8. 8 is the most Minecraft allows | default: 8
GuaranteeShip=true #Every city gets at least one ship (if MaximumShips is above 0) | default: true
CityShape=mixed #City shape: vanilla, flat, tall, mushroom, pine, ring, spire, custom (uses the tuning values below), or mixed (picks one per city using ShapeWeights) | default: mixed
ShapeWeights=flat:1,tall:1,mushroom:1,pine:1,ring:1,spire:1,vanilla:1,custom:1 #For CityShape=mixed: how often each shape is picked, as shape:weight pairs | default: flat:1,tall:1,mushroom:1,pine:1,ring:1,spire:1,vanilla:1,custom:1
BridgeChanceCenter=0.5 #Chance for each bridge slot near the city center (vanilla 0.5) | default: 0.5
BridgeChanceEdge=0.35 #Chance for each bridge slot at the city edge | default: 0.35
BranchingBridgeChanceCenter=0.9 #Same as BridgeChanceCenter, used when PrioritizeBranching is true | default: 0.9
BranchingBridgeChanceEdge=0.35 #Same as BridgeChanceEdge, used when PrioritizeBranching is true | default: 0.35
FatTowerChanceCenter=0.5 #Chance for a tower to be a fat tower in the center zone | default: 0.5
FatTowerChanceMiddle=0.15 #Chance for a tower to be a fat tower between the center and edge zones | default: 0.15
FatTowerChanceEdge=0.6 #Chance for a tower to be a fat tower in the edge zone (as an end cap) | default: 0.6
CenterZone=0.3 #How far out the center zone reaches, from 0 (center) to 1 (end of a branch by depth or height) | default: 0.3
EdgeZone=0.8 #Where the edge zone starts, from 0 (center) to 1 (end of a branch by depth or height) | default: 0.8
StairsChanceCenter=0.2 #Chance for each bridge segment to be stairs near the center (vanilla 0.5) | default: 0.2
StairsChanceEdge=0.6 #Chance for each bridge segment to be stairs at the edge | default: 0.6
BridgeClimbChanceCenter=0.2 #Chance for a tower's bridges to move up one segment near the center (vanilla 0.5) | default: 0.2
BridgeClimbChanceEdge=0.5 #Chance for a tower's bridges to move up one segment at the edge | default: 0.5
TowerSegmentsCenter=1 #Maximum extra tower segments near the center (vanilla 3) | default: 1
TowerSegmentsEdge=3 #Maximum extra tower segments at the edge | default: 3
EarlyBranchDepthPenalty=2 #In the center zone, the first bridges tried from a tower get up to this much less depth, so one branch can't claim all the space | default: 2
FatTowerHeadroom=48 #Fat towers only start this many blocks or more below the build limit | default: 48

