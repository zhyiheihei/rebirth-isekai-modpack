[settings]
	# Allows Piglins to barter food items and Strider Rocks from this mod.Special hunting-related trades are not affected.
	# default: true
	enablePiglinFoodTrades = true
	# Chance that a Piglin barter gives food or Strider Rocks from this mod.0.25 equals 25%; 0 disables these results.
	# range: 0.0 - 1.0
	# default: 0.25
	piglinFoodTradeChance = 0.25
	# Allows Frogs to seek out Magma Cake and Magma Cake Slices,and lets players feed slices directly to a Frog.
	# default: true
	enableFrogMagmaCakeBehavior = true

[farming]
	# Allows Resurgent Soil and Resurgent Soil Farmland to propagate nearby plants.
	# default: true
	enableResurgentSoilPropagation = true
	# Multiplier for growth, transformation and propagation attempts made by Resurgent Soiland Resurgent Soil Farmland. Farmland hydration and drying are not affected.
	# range: 0.0 - 16.0
	# default: 1.0
	resurgentSoilTickMultiplier = 1.0
	# Maximum vertical distance that Resurgent Soil follows connected plants while applying growth.Range: 0 ~ 64.
	# range: 0 - 64
	# default: 10
	resurgentSoilGrowthRange = 10
	# Horizontal radius that Resurgent Soil Farmland searches for valid heat sources.Vertical range is half this value. Set to 0 to disable heat hydration.Range: 0 ~ 16.
	# range: 0 - 16
	# default: 7
	resurgentFarmlandHeatSearchRadius = 7
